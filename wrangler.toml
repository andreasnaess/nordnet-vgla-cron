name = "nordnet-vgla-cron"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Cron-only worker: no public *.workers.dev URL or preview URLs.
workers_dev = false
preview_urls = false

# Store logs in Workers Logs (7-day retention) so past runs can be inspected.
[observability]
enabled = true

# Daily at 07:00 UTC. While VGLA is saveable you get one reminder per day,
# so delete the worker (`pnpm wrangler delete`) once you've set up the saving.
[triggers]
crons = ["0 7 * * *"]

# Secrets (not in this file):
#   pnpm wrangler secret put TELEGRAM_BOT_TOKEN
#   pnpm wrangler secret put TELEGRAM_CHAT_ID
